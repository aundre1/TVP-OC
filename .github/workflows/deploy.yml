name: Automated Deploy Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  NODE_ENV: production

jobs:
  build-and-test:
    name: Build & Test Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint code
        run: npm run lint
        continue-on-error: true

      - name: Build frontend
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'https://tvp-oc-production.up.railway.app' }}

      - name: Run tests
        run: npm run test:run
        continue-on-error: true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: dist
          retention-days: 5

  deploy-frontend:
    name: Deploy Frontend to Vercel
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'https://tvp-oc-production.up.railway.app' }}

  deploy-backend:
    name: Deploy Backend to Railway
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Railway
        run: |
          npm install -g @railway/cli
          railway up
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  post-deploy:
    name: Post-Deployment Verification
    runs-on: ubuntu-latest
    needs: [deploy-frontend, deploy-backend]
    if: always()

    steps:
      - name: Check deployment status
        run: |
          echo "Frontend deployment status: ${{ needs.deploy-frontend.result }}"
          echo "Backend deployment status: ${{ needs.deploy-backend.result }}"

      - name: Verify frontend health
        run: |
          MAX_ATTEMPTS=30
          ATTEMPT=0
          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://tvp-redesign-2026.vercel.app)
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Frontend is healthy (HTTP $HTTP_CODE)"
              exit 0
            fi
            ATTEMPT=$((ATTEMPT + 1))
            echo "Attempt $ATTEMPT: HTTP $HTTP_CODE - waiting..."
            sleep 10
          done
          echo "Frontend health check failed after $MAX_ATTEMPTS attempts"
          exit 1
        continue-on-error: true

      - name: Verify backend health
        run: |
          MAX_ATTEMPTS=30
          ATTEMPT=0
          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://tvp-oc-production.up.railway.app/health)
            if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "404" ]; then
              echo "Backend is responding (HTTP $HTTP_CODE)"
              exit 0
            fi
            ATTEMPT=$((ATTEMPT + 1))
            echo "Attempt $ATTEMPT: HTTP $HTTP_CODE - waiting..."
            sleep 10
          done
          echo "Backend health check failed after $MAX_ATTEMPTS attempts"
          exit 1
        continue-on-error: true

      - name: Notify deployment completion
        if: always()
        run: |
          if [ "${{ needs.deploy-frontend.result }}" = "success" ] && [ "${{ needs.deploy-backend.result }}" = "success" ]; then
            echo "✅ Deployment completed successfully"
            exit 0
          else
            echo "⚠️ Deployment completed with warnings"
            exit 0
          fi
