<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#001a33;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#003366;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00b8d4;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" fill="url(#bgGradient)"/>

  <!-- Rounded rectangle for modern look -->
  <rect x="50" y="50" width="924" height="924" rx="180" ry="180" fill="url(#bgGradient)"/>

  <!-- Play button circle (film reel concept) -->
  <circle cx="512" cy="512" r="350" fill="url(#accentGradient)" opacity="0.2"/>

  <!-- Main play button symbol -->
  <g transform="translate(512, 512)">
    <!-- Outer circle -->
    <circle cx="0" cy="0" r="280" fill="none" stroke="url(#accentGradient)" stroke-width="30"/>

    <!-- Play triangle (represents video playback) -->
    <polygon points="0,-150 260,100 -260,100" fill="url(#accentGradient)"/>

    <!-- Film strip details on sides -->
    <rect x="-280" y="-100" width="40" height="60" fill="url(#accentGradient)" opacity="0.6"/>
    <rect x="-280" y="-20" width="40" height="60" fill="url(#accentGradient)" opacity="0.6"/>
    <rect x="-280" y="60" width="40" height="60" fill="url(#accentGradient)" opacity="0.6"/>

    <rect x="240" y="-100" width="40" height="60" fill="url(#accentGradient)" opacity="0.6"/>
    <rect x="240" y="-20" width="40" height="60" fill="url(#accentGradient)" opacity="0.6"/>
    <rect x="240" y="60" width="40" height="60" fill="url(#accentGradient)" opacity="0.6"/>
  </g>

  <!-- Top accent line -->
  <line x1="150" y1="150" x2="350" y2="150" stroke="url(#accentGradient)" stroke-width="20" stroke-linecap="round" opacity="0.8"/>

  <!-- Bottom accent line -->
  <line x1="674" y1="874" x2="874" y2="874" stroke="url(#accentGradient)" stroke-width="20" stroke-linecap="round" opacity="0.8"/>

  <!-- Corner dots for visual interest -->
  <circle cx="150" cy="150" r="25" fill="url(#accentGradient)" opacity="0.7"/>
  <circle cx="874" cy="874" r="25" fill="url(#accentGradient)" opacity="0.7"/>
</svg>
